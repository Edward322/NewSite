<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>С днём рождения</title>
<!--
  Абсурдная брейнрот-открытка «С днём рождения».
  Эмодзи 🤓 🦐 💀 🔥 — Twemoji (jdecked/twemoji), CC-BY 4.0.
  Шрифты Oswald и Russo One — SIL Open Font License.
  ?export  — режим 1080×1920 без интерфейса (для скриншота).
  ?still   — без анимации.
  ?video   — 1080×1920 с анимацией (для записи видео, цикл 12 с).
-->
<style>
  @font-face { font-family: "Oswald Card"; src: url("fonts/oswald-bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
  @font-face { font-family: "Russo Card"; src: url("fonts/russo-one.ttf") format("truetype"); font-display: block; }

  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07000f; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #card {
    display: block; flex: none;
    height: calc(100dvh - 64px); width: auto; max-width: 100vw; aspect-ratio: 9 / 16;
    filter: saturate(1.12) contrast(1.04);
    user-select: none; -webkit-user-select: none;
  }
  .tools { height: 64px; display: flex; gap: 10px; align-items: center; }
  .tools button {
    font: 600 15px/1 system-ui, sans-serif; color: #fff; background: #ffffff1f;
    border: 1px solid #ffffff38; border-radius: 999px; padding: 11px 16px; cursor: pointer;
  }
  .tools button:hover { background: #ffffff33; }
  #portrait { cursor: pointer; }

  body.export { display: block; overflow: visible; }
  body.export #card { width: 1080px; height: 1920px; max-width: none; }
  body.export .tools { display: none; }

  /* ---------- анимации ---------- */
  .fb  { transform-box: fill-box; transform-origin: 50% 50%; }
  .fbb { transform-box: fill-box; transform-origin: 50% 100%; }
  body:not(.still) .a-sway    { animation: sway 4s ease-in-out infinite; }
  body:not(.still) .a-rays    { animation: spin 12s linear infinite; transform-origin: 540px 620px; }
  body:not(.still) .a-fly     { animation: fly 3s ease-in-out infinite; }
  body:not(.still) .a-prop    { animation: prop .12s linear infinite; }
  body:not(.still) .a-nod     { animation: nod 1.5s ease-in-out infinite; }
  body:not(.still) .a-bob     { animation: bob 2s ease-in-out infinite; }
  body:not(.still) .a-bob2    { animation: bob 3s ease-in-out infinite -1s; }
  body:not(.still) .a-jump    { animation: jump 1s cubic-bezier(.3,0,.4,1) infinite; }
  body:not(.still) .a-twirl   { animation: twirl 2s ease-in-out infinite; }
  body:not(.still) .a-pulse   { animation: pulse 1s ease-in-out infinite; }
  body:not(.still) .a-wiggle  { animation: wiggle 1.5s ease-in-out infinite; }
  body:not(.still) .a-ring    { animation: ring 1.5s ease-out infinite; }
  body:not(.still) .a-ring2   { animation: ring 1.5s ease-out infinite -.75s; }
  body:not(.still) .a-spin    { animation: spinStar 6s linear infinite; }
  body:not(.still) .fw        { animation: burst 2s ease-out infinite; }
  body:not(.still) .tw        { animation: twinkle 1.5s ease-in-out infinite; }
  body:not(.still) .flame     { animation: flicker .3s ease-in-out infinite alternate; }
  body:not(.still) .confetti  { animation: drift 3s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  @keyframes sway    { 0%,100% { transform: rotate(-2deg) } 50% { transform: rotate(2deg) } }
  @keyframes spin    { to { transform: rotate(30deg) } }
  @keyframes spinStar{ to { transform: rotate(360deg) } }
  @keyframes fly     { 0%,100% { transform: translate(0,0) rotate(0) } 50% { transform: translate(18px,-14px) rotate(-3deg) } }
  @keyframes prop    { 0% { transform: scaleY(1) } 50% { transform: scaleY(-1) } 100% { transform: scaleY(1) } }
  @keyframes nod     { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(5deg) translateY(6px) } }
  @keyframes bob     { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
  @keyframes jump    { 0%,100% { transform: translateY(0) scale(1.03,.97) } 45% { transform: translateY(-38px) scale(.98,1.03) } }
  @keyframes twirl   { 0%,100% { transform: rotate(-5deg) } 50% { transform: rotate(5deg) translateY(-10px) } }
  @keyframes pulse   { 0%,100% { transform: scale(1) } 50% { transform: scale(1.045) } }
  @keyframes wiggle  { 0%,55%,100% { transform: rotate(0) } 62% { transform: rotate(-16deg) } 72% { transform: rotate(14deg) } 82% { transform: rotate(-10deg) } 90% { transform: rotate(6deg) } }
  @keyframes ring    { 0% { transform: scale(1); opacity: .8 } 100% { transform: scale(1.8); opacity: 0 } }
  @keyframes burst   { 0% { transform: scale(.1); opacity: 0 } 10% { opacity: 1 } 65% { opacity: 1 } 100% { transform: scale(1.1); opacity: 0 } }
  @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.5) } 50% { opacity: 1; transform: scale(1.2) } }
  @keyframes flicker { from { transform: scale(1,1) } to { transform: scale(.82,1.18) } }
  @keyframes drift   { 0%,100% { transform: translateY(0) rotate(0) } 50% { transform: translateY(10px) rotate(25deg) } }
</style>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  if (params.has('export')) document.body.classList.add('export', 'still');
  if (params.has('still')) document.body.classList.add('still');
  if (params.has('video')) document.body.classList.add('export');

  let seed = 20261002;
  const rnd = () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const star4 = (x, y, s) =>
    `M${x},${y - s} Q${x},${y} ${x + s},${y} Q${x},${y} ${x},${y + s} Q${x},${y} ${x - s},${y} Q${x},${y} ${x},${y - s}Z`;
  const PARTY = ['#ff2d55', '#ffd60a', '#30d5ff', '#34c759', '#bf5af2', '#ff9f0a', '#ffffff', '#ff4fd8'];

  // --- лучи
  for (let i = 0; i < 24; i += 2) {
    const a1 = (i / 24) * Math.PI * 2, a2 = ((i + 1) / 24) * Math.PI * 2, R = 1700;
    el('path', { d: `M540,620 L${540 + R * Math.cos(a1)},${620 + R * Math.sin(a1)} L${540 + R * Math.cos(a2)},${620 + R * Math.sin(a2)}Z` }, $('rays'));
  }

  // --- неоновый пол
  const H = 1185;
  for (let i = 1; i <= 16; i++) {
    const y = H + 735 * Math.pow(i / 16, 2.1);
    el('line', { x1: 0, x2: 1080, y1: y, y2: y }, $('grid'));
  }
  for (let k = -14; k <= 14; k++) el('line', { x1: 540 + k * 14, y1: H, x2: 540 + k * 150, y2: 1920 }, $('grid'));

  // --- звёзды
  for (let i = 0; i < 90; i++) {
    el('circle', { cx: rnd() * 1080, cy: rnd() * 1150, r: (rnd() * 2.2 + .6).toFixed(2), fill: '#fff', opacity: (.3 + rnd() * .6).toFixed(2) }, $('stars'));
  }
  for (let i = 0; i < 16; i++) {
    const s = el('path', { d: star4(rnd() * 1080, 60 + rnd() * 1080, 8 + rnd() * 14), fill: '#fff', class: 'tw fb' }, $('stars'));
    s.style.animationDelay = (-rnd() * 1.5).toFixed(2) + 's';
  }

  // --- салюты
  const FW = [
    [180, 300, 150, '#ffd34d', '#fff6c9'],
    [880, 190, 125, '#ff4fd8', '#ffd1f5'],
    [560, 175, 85, '#ff8a3d', '#ffe0c4'],
    [70, 1015, 95, '#38e8ff', '#d2fbff'],
    [1010, 1235, 95, '#7dff6b', '#e2ffd9'],
    [350, 1000, 70, '#bf5af2', '#f0d9ff'],
  ];
  FW.forEach(([x, y, r, c1, c2], j) => {
    const g = el('g', { class: 'fw fb' }, $('fireworks'));
    g.style.animationDelay = (-j * 0.37).toFixed(2) + 's';
    el('circle', { cx: x, cy: y, r: r * .22, fill: c2, opacity: .55, filter: 'url(#fBlur8)' }, g);
    const n = 30;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rnd() * .08;
      const r1 = r * .2, r2 = r * (.72 + rnd() * .28);
      el('line', {
        x1: x + r1 * Math.cos(a), y1: y + r1 * Math.sin(a), x2: x + r2 * Math.cos(a), y2: y + r2 * Math.sin(a),
        stroke: c1, 'stroke-width': 4, 'stroke-linecap': 'round', opacity: .9,
      }, g);
      el('circle', { cx: x + (r2 + 9) * Math.cos(a), cy: y + (r2 + 9) * Math.sin(a), r: 4.5, fill: c2 }, g);
      if (i % 2 === 0) {
        const r3 = r * (.45 + rnd() * .15);
        el('circle', { cx: x + r3 * Math.cos(a + .1), cy: y + r3 * Math.sin(a + .1), r: 3, fill: '#fff' }, g);
      }
    }
  });

  // --- конфетти
  const confetti = (parent, n, yMin, yMax) => {
    for (let i = 0; i < n; i++) {
      const x = rnd() * 1080, y = yMin + rnd() * (yMax - yMin), c = PARTY[Math.floor(rnd() * PARTY.length)];
      const g = el('g', { transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${Math.floor(rnd() * 360)})` }, parent);
      const inner = el('g', { class: 'confetti fb' }, g);
      inner.style.animationDelay = (-rnd() * 3).toFixed(2) + 's';
      if (rnd() < .65) el('rect', { x: -9, y: -4, width: 18, height: 8, rx: 2, fill: c }, inner);
      else el('circle', { r: 5.5, fill: c }, inner);
    }
  };
  confetti($('confettiBack'), 80, 260, 1900);
  confetti($('confettiFront'), 26, 280, 1700);

  // --- шарики (нитки сходятся к левому плавнику)
  const TIP = [226, 874];
  const BALLOONS = [
    [92, 548, '#ff2d55'], [205, 520, '#ffd60a'], [312, 560, '#30d5ff'],
    [46, 660, '#34c759'], [150, 640, '#bf5af2'], [258, 652, '#ff9f0a'],
    [96, 758, '#ff375f'], [204, 748, '#0a84ff'], [310, 756, '#f5f5f7'],
  ];
  const strings = el('g', { stroke: '#f2f2f2', 'stroke-width': 2.5, fill: 'none', opacity: .9 }, $('balloons'));
  BALLOONS.forEach(([x, y]) => {
    const bx = x, by = y + 74, mx = bx + (TIP[0] - bx) * .35 + (rnd() - .5) * 30, my = (by + TIP[1]) / 2;
    el('path', { d: `M${bx},${by} Q${mx},${my} ${TIP[0]},${TIP[1]}` }, strings);
  });
  BALLOONS.forEach(([x, y, c]) => {
    const g = el('g', {}, $('balloons'));
    el('path', { d: `M${x - 9},${y + 76} L${x},${y + 64} L${x + 9},${y + 76}Z`, fill: c }, g);
    el('ellipse', { cx: x, cy: y, rx: 58, ry: 70, fill: c }, g);
    el('ellipse', { cx: x, cy: y, rx: 58, ry: 70, fill: 'url(#gBalloonShade)' }, g);
    el('ellipse', { cx: x - 22, cy: y - 30, rx: 12, ry: 22, fill: '#fff', opacity: .65, transform: `rotate(28 ${x - 22} ${y - 30})` }, g);
    el('circle', { cx: x - 30, cy: y - 2, r: 4, fill: '#fff', opacity: .5 }, g);
  });

  // --- зубы акулы
  const teeth = $('sharkTeeth');
  for (let i = 0; i < 10; i++) {
    const t = (i + .5) / 10, x = 410 + 260 * t, y = 705 + 70 * t * (1 - t) - 3;
    el('path', { d: `M${x - 13},${y} L${x + 13},${y} L${x},${y + 26}Z` }, teeth);
  }
  for (let i = 0; i < 8; i++) {
    const t = (i + .5) / 8, x = 410 + 260 * t, y = 705 + 280 * t * (1 - t) + 3;
    el('path', { d: `M${x - 12},${y} L${x + 12},${y} L${x},${y - 22}Z` }, teeth);
  }

  // --- чешуя и зубы крокодила
  for (let x = -150; x <= 120; x += 22) el('path', { d: `M${x},-42 a11,11 0 0 1 22,0Z` }, $('crocScales'));
  for (let x = 150; x <= 288; x += 15) {
    el('path', { d: `M${x},-4 L${x + 10},-4 L${x + 5},6Z` }, $('crocTeeth'));
    el('path', { d: `M${x + 6},7 L${x + 15},7 L${x + 10},-2Z` }, $('crocTeeth'));
  }

  // --- «deal with it» очки
  const ROWS = [
    'XXXXXXXXXXXXXXXXXXXXXX',
    '.XWWXXXXXX..XWWXXXXXX.',
    '..XWWXXXX....XWWXXXX..',
    '...XXXXX......XXXXX...',
  ];
  ROWS.forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === '.') return;
    el('rect', { x: c * 10, y: r * 10, width: 10.4, height: 10.4, fill: ch === 'W' ? '#fff' : '#0a0a0a' }, $('dealWithIt'));
  }));

  // --- торт: подтёки, посыпка, свечи, бордюр портрета
  const cx = 880, cy = 715, rx = 135, ry = 36;
  for (let i = 0; i < 13; i++) {
    const th = Math.PI * (i + .5) / 13, x = cx + rx * Math.cos(th), y = cy + ry * Math.sin(th);
    const w = 18 + rnd() * 10, d = 22 + rnd() * 46;
    el('rect', { x: x - w / 2, y: y - 6, width: w, height: d, rx: w / 2 }, $('drips'));
  }
  for (let i = 0; i < 40; i++) {
    const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd());
    const x = cx + Math.cos(a) * rx * .82 * rr, y = cy + Math.sin(a) * ry * .75 * rr;
    el('rect', { x: x - 5, y: y - 1.5, width: 10, height: 3, rx: 1.5, fill: PARTY[i % 6], transform: `rotate(${Math.floor(rnd() * 180)} ${x} ${y})` }, $('sprinkles'));
  }
  const CANDLES = [[-84, 2, '#30d5ff'], [-44, -16, '#ffd60a'], [0, 8, '#ff4fd8'], [42, -14, '#34c759'], [84, 4, '#bf5af2']];
  CANDLES.forEach(([dx, dy, c]) => {
    const x = cx + dx, base = cy + dy, h = 62;
    const g = el('g', {}, $('candles'));
    el('rect', { x: x - 8, y: base - h, width: 16, height: h, rx: 4, fill: c, stroke: '#00000040', 'stroke-width': 2 }, g);
    for (let s = 0; s < 4; s++) el('path', { d: `M${x - 8},${base - h + 10 + s * 15} L${x + 8},${base - h + 2 + s * 15} L${x + 8},${base - h + 7 + s * 15} L${x - 8},${base - h + 15 + s * 15}Z`, fill: '#fff', opacity: .85 }, g);
    el('line', { x1: x, y1: base - h, x2: x, y2: base - h - 8, stroke: '#222', 'stroke-width': 2.5 }, g);
    const fl = el('g', { filter: 'url(#fGlow)' }, g);
    const f = el('path', { d: `M${x},${base - h - 40} Q${x + 13},${base - h - 20} ${x + 9},${base - h - 9} Q${x},${base - h - 1} ${x - 9},${base - h - 9} Q${x - 13},${base - h - 20} ${x},${base - h - 40}Z`, fill: 'url(#gFlame)', class: 'flame fbb' }, fl);
    f.style.animationDelay = (-rnd() * .3).toFixed(2) + 's';
  });
  for (let i = 0; i < 20; i++) {
    const a = (i / 20) * Math.PI * 2;
    el('circle', { cx: 68 * Math.cos(a), cy: 68 * Math.sin(a), r: 7 }, $('piping'));
  }

  // --- пачка балерины
  let frill = 'M-150,34';
  for (let i = 0; i < 12; i++) {
    const x0 = -150 + i * 25, x1 = x0 + 25;
    frill += ` Q${x0 + 12.5},${70 + (i % 2) * 8} ${x1},34`;
  }
  frill += ' Q0,-6 -150,34Z';
  el('path', { d: frill }, $('tutuFrill'));

  // --- 3D-объём заголовка
  const ext = $('extrude');
  for (let i = 16; i >= 1; i--) {
    const k = i / 16, col = `rgb(${Math.round(190 - 120 * k)},${Math.round(70 - 50 * k)},0)`;
    ['#t1', '#t2'].forEach(id => el('use', {
      href: id, x: (i * .7).toFixed(1), y: (i * 1.3).toFixed(1),
      fill: col, stroke: col, 'stroke-width': 24, 'stroke-linejoin': 'round',
    }, ext));
  }
  [[300, 920, 18], [742, 930, 14], [215, 1100, 16], [880, 1110, 20], [520, 1095, 12], [610, 950, 10]].forEach(([x, y, s], i) => {
    const p = el('path', { d: star4(x, y, s), class: 'tw fb' }, $('titleSparkles'));
    p.style.animationDelay = (-i * .27).toFixed(2) + 's';
  });

  // --- звезда-стикер «+1000 ауры»
  let sp = '';
  for (let i = 0; i < 36; i++) {
    const a = (i / 36) * Math.PI * 2, r = i % 2 ? 80 : 112;
    sp += (i ? 'L' : 'M') + (r * Math.cos(a)).toFixed(1) + ',' + (r * Math.sin(a)).toFixed(1);
  }
  $('burstStar').setAttribute('d', sp + 'Z');

  // --- фото на торт
  const file = $('file'), img = $('portraitImg'), emoji = $('portraitEmoji');
  const pick = () => file.click();
  $('btnPhoto').addEventListener('click', pick);
  $('portrait').addEventListener('click', pick);
  file.addEventListener('change', () => {
    const f = file.files && file.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      img.setAttribute('href', reader.result);
      img.style.display = '';
      emoji.style.display = 'none';
    };
    reader.readAsDataURL(f);
  });

  // --- сохранить PNG
  const toDataURL = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
  $('btnSave').addEventListener('click', async () => {
    const btn = $('btnSave'), label = btn.textContent;
    btn.textContent = '⏳ Рисую…';
    try {
      const fonts = await Promise.all([
        ['Oswald Card', 'fonts/oswald-bold.ttf', 700],
        ['Russo Card', 'fonts/russo-one.ttf', 400],
      ].map(async ([family, url, weight]) => {
        const data = await toDataURL(await (await fetch(url)).blob());
        return `@font-face{font-family:"${family}";src:url(${data}) format("truetype");font-weight:${weight};}`;
      }));
      const svg = $('card').cloneNode(true);
      svg.setAttribute('width', 1080);
      svg.setAttribute('height', 1920);
      svg.removeAttribute('class');
      const style = document.createElementNS(NS, 'style');
      style.textContent = fonts.join('') + '*{animation:none!important}';
      svg.insertBefore(style, svg.firstChild);
      const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' }));
      const pic = new Image();
      pic.src = url;
      await pic.decode();
      const canvas = Object.assign(document.createElement('canvas'), { width: 1080, height: 1920 });
      canvas.getContext('2d').drawImage(pic, 0, 0, 1080, 1920);
      URL.revokeObjectURL(url);
      const a = Object.assign(document.createElement('a'), { download: 's-dnem-rozhdeniya.png', href: canvas.toDataURL('image/png') });
      a.click();
    } catch (err) {
      alert('Не получилось сохранить — сделай скриншот 🙃');
    } finally {
      btn.textContent = label;
    }
  });
})();
</script>
</body>
</html>

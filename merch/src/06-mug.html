<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кружка и термостакан</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<script src="shared.js"></script>
<div class="scene">
<svg viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="wall6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3eeff"/><stop offset="1" stop-color="#e2d8ff"/>
    </linearGradient>
    <linearGradient id="table6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3c4fb"/><stop offset="1" stop-color="#b9a4f2"/>
    </linearGradient>
    <linearGradient id="gloss6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset=".16" stop-color="#000" stop-opacity=".05"/>
      <stop offset=".22" stop-color="#fff" stop-opacity=".32"/><stop offset=".28" stop-color="#fff" stop-opacity=".04"/>
      <stop offset=".72" stop-color="#000" stop-opacity=".05"/><stop offset=".88" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </linearGradient>
    <radialGradient id="coffee" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#8a5a3a"/><stop offset=".55" stop-color="#5a341f"/><stop offset="1" stop-color="#2e170c"/>
    </radialGradient>
    <clipPath id="mugBody"><path d="M0 40 L0 330 A150 30 0 0 0 300 330 L300 40 Z"/></clipPath>
    <clipPath id="tumBody"><path d="M12 76 L168 76 L158 440 A68 14 0 0 1 22 440 Z"/></clipPath>
  </defs>

  <rect width="1600" height="1200" fill="url(#wall6)"/>
  <rect y="560" width="1600" height="640" fill="url(#table6)"/>
  <rect y="540" width="1600" height="50" fill="#fff" opacity=".35" filter="url(#b14)"/>
  <rect width="1600" height="1200" filter="url(#paper)" opacity=".12" style="mix-blend-mode:multiply"/>

  <!-- постер на стене -->
  <g transform="translate(210 96)">
    <rect x="10" y="16" width="300" height="390" fill="#2a1560" opacity=".25" filter="url(#b14)"/>
    <rect width="300" height="390" fill="#1c0a3f"/>
    <rect x="14" y="14" width="272" height="362" fill="#5b2bd0"/>
    <use href="#emblem" x="40" y="36" width="220" height="220" style="--em-bg:#3b1886; --em-inner:#7b4dff"/>
    <text x="150" y="300" text-anchor="middle" class="u" font-weight="900" font-size="40" fill="#d2ff3f">ИУЭС</text>
    <text x="150" y="340" text-anchor="middle" class="h" font-size="30" fill="#ffffff">управляю своим будущим</text>
    <rect x="14" y="14" width="272" height="362" fill="url(#gloss)" opacity=".5"/>
  </g>

  <!-- стопка книг -->
  <g transform="translate(150 632)">
    <rect x="6" y="10" width="420" height="104" rx="6" fill="#2a1560" opacity=".3" filter="url(#b8)"/>
    <rect x="0" y="56" width="420" height="52" rx="6" fill="#b8a1ff"/>
    <rect x="0" y="56" width="18" height="52" rx="4" fill="#9a82ee"/>
    <text x="40" y="90" class="m" font-weight="800" font-size="16" letter-spacing="3" fill="#3b1886">МЕНЕДЖМЕНТ • ЭКОЛОГИЯ</text>
    <rect x="22" y="6" width="380" height="50" rx="6" fill="#5b2bd0"/>
    <rect x="22" y="6" width="18" height="50" rx="4" fill="#4a1fb8"/>
    <rect x="330" y="6" width="14" height="50" fill="#d2ff3f"/>
    <text x="60" y="41" class="u" font-weight="900" font-size="22" fill="#e4d9ff">ИУЭС • КОНСПЕКТЫ</text>
  </g>

  <!-- ===== Термостакан ===== -->
  <g transform="translate(1000 318) scale(1.2)">
    <ellipse cx="90" cy="446" rx="110" ry="20" fill="#2a1560" opacity=".4" filter="url(#b8)"/>
    <path d="M12 76 L168 76 L158 440 A68 14 0 0 1 22 440 Z" fill="#b29af9"/>
    <g clip-path="url(#tumBody)">
      <g filter="url(#print)">
        <use href="#owl" x="36" y="112" width="108" height="132" style="--owl-body:#5b2bd0; --owl-face:#e4d9ff; --owl-belly:#e4d9ff; --owl-accent:#d2ff3f"/>
        <text x="90" y="290" text-anchor="middle" class="u" font-weight="900" font-size="21" fill="#1c0a3f">НЕ СПЛЮ</text>
        <text x="90" y="318" text-anchor="middle" class="u" font-weight="900" font-size="21" fill="#ffffff">УЧУСЬ</text>
        <path d="M44 342 H136" stroke="#1c0a3f" stroke-width="2" stroke-dasharray="3 5"/>
        <text x="90" y="372" text-anchor="middle" class="m" font-weight="800" font-size="11" letter-spacing="3" fill="#1c0a3f">ИУЭС • ЮФУ</text>
      </g>
      <rect x="0" y="60" width="180" height="400" fill="url(#gloss6)"/>
    </g>
    <path d="M22 440 A68 14 0 0 0 158 440" fill="none" stroke="#7b62d8" stroke-width="3"/>
    <!-- крышка -->
    <path d="M6 18 L174 18 L174 78 A84 12 0 0 1 6 78 Z" fill="#1c0a3f"/>
    <path d="M6 18 L174 18 L174 78 A84 12 0 0 1 6 78 Z" fill="url(#gloss6)"/>
    <ellipse cx="90" cy="18" rx="84" ry="14" fill="#2d1760"/>
    <ellipse cx="90" cy="18" rx="70" ry="10" fill="#1c0a3f"/>
    <rect x="98" y="10" width="44" height="12" rx="6" fill="#d2ff3f"/>
    <path d="M6 64 A84 12 0 0 0 174 64" fill="none" stroke="#d2ff3f" stroke-width="3"/>
  </g>

  <!-- ===== Кружка ===== -->
  <g transform="translate(470 500) scale(1.25)">
    <ellipse cx="170" cy="340" rx="200" ry="30" fill="#2a1560" opacity=".4" filter="url(#b8)"/>
    <!-- ручка -->
    <path d="M292 100 C382 96 394 262 292 272" fill="none" stroke="#2f1372" stroke-width="34" stroke-linecap="round"/>
    <path d="M300 112 C366 110 376 250 300 258" fill="none" stroke="#6a45d8" stroke-width="6" opacity=".6" stroke-linecap="round"/>
    <!-- корпус -->
    <path d="M0 40 L0 330 A150 30 0 0 0 300 330 L300 40 Z" fill="#3b1886"/>
    <g clip-path="url(#mugBody)">
      <g filter="url(#print)">
        <text x="34" y="124" class="u" font-weight="900" font-size="34" fill="#d2ff3f">КОФЕ.</text>
        <text x="34" y="168" class="u" font-weight="900" font-size="34" fill="#ffffff">ДЕДЛАЙН.</text>
        <text x="34" y="212" class="u" font-weight="900" font-size="34" fill="#b8a1ff">ДИПЛОМ.</text>
        <g transform="translate(34 240)">
          <circle cx="22" cy="22" r="22" fill="#d2ff3f"/><use href="#i-coffee" x="9" y="8" width="26" height="26" color="#1c0a3f"/>
          <path d="M52 22 h22 m-7 -6 l7 6 l-7 6" fill="none" stroke="#b8a1ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="104" cy="22" r="22" fill="#ffffff"/><use href="#i-bolt" x="91" y="9" width="26" height="26" color="#5b2bd0"/>
          <path d="M134 22 h22 m-7 -6 l7 6 l-7 6" fill="none" stroke="#b8a1ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="186" cy="22" r="22" fill="#b8a1ff"/><use href="#i-cap" x="173" y="9" width="26" height="26" color="#1c0a3f"/>
        </g>
      </g>
      <rect x="0" y="0" width="300" height="380" fill="url(#gloss6)"/>
    </g>
    <!-- край и кофе -->
    <ellipse cx="150" cy="40" rx="150" ry="30" fill="#4a24a0"/>
    <ellipse cx="150" cy="41" rx="140" ry="25" fill="#d2ff3f"/>
    <ellipse cx="150" cy="52" rx="130" ry="20" fill="url(#coffee)"/>
    <ellipse cx="150" cy="52" rx="130" ry="20" fill="none" stroke="#c9a17c" stroke-width="5" opacity=".7"/>
    <path d="M12 21.3 L10.5 20 C5.4 15.4 2 12.3 2 8.5 C2 5.4 4.4 3 7.5 3 C9.2 3 10.9 3.8 12 5.1 C13.1 3.8 14.8 3 16.5 3 C19.6 3 22 5.4 22 8.5 C22 12.3 18.6 15.4 13.5 20 Z" transform="translate(126 40) scale(2 .9)" fill="#f1dcc3" opacity=".9"/>
    <path d="M30 22 A150 30 0 0 1 150 10" fill="none" stroke="#fff" stroke-width="3" opacity=".45"/>
  </g>

  <!-- зёрна и стикер -->
  <g fill="#3a2012">
    <g transform="translate(360 950) rotate(30)"><ellipse rx="16" ry="11"/><path d="M-12 0 Q0 -4 12 0" stroke="#1a0c05" stroke-width="2" fill="none"/></g>
    <g transform="translate(398 978) rotate(-20)"><ellipse rx="16" ry="11"/><path d="M-12 0 Q0 -4 12 0" stroke="#1a0c05" stroke-width="2" fill="none"/></g>
    <g transform="translate(1290 900) rotate(70)"><ellipse rx="16" ry="11"/><path d="M-12 0 Q0 -4 12 0" stroke="#1a0c05" stroke-width="2" fill="none"/></g>
  </g>
  <use href="#st-deadline" x="1200" y="920" width="170" height="124" transform="rotate(8 1285 982)" filter="url(#diecut)"/>

  <text x="64" y="1070" class="u" font-weight="800" font-size="30" fill="#1c0a3f">Кружка «Кофе. Дедлайн. Диплом.» и термостакан</text>
  <text x="64" y="1108" class="m" font-weight="500" font-size="20" fill="#4a3d78">Керамика 350 мл, матовая глазурь ночного цвета, внутри — лайм · деколь, выдерживает посудомойку</text>
  <text x="64" y="1138" class="m" font-weight="500" font-size="20" fill="#4a3d78">Термостакан 450 мл из нержавейки в лавандовом покрытии, крышка-слайдер, сова «Не сплю — учусь»</text>
  <text x="1536" y="1138" text-anchor="end" class="u" font-weight="800" font-size="18" fill="#7b4dff">МЕРЧ ИУЭС • 06</text>

  <rect width="1600" height="1200" filter="url(#grain)" opacity=".07" style="mix-blend-mode:overlay"/>
</svg>
</div>
</body>
</html>

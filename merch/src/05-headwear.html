<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Панама, бини, кепка</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<script src="shared.js"></script>
<div class="scene">
<svg viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece5ff"/><stop offset="1" stop-color="#c9b8f6"/>
    </linearGradient>
    <linearGradient id="podSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d86e6"/><stop offset=".45" stop-color="#d9ccff"/><stop offset="1" stop-color="#8e76dc"/>
    </linearGradient>
    <linearGradient id="podTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efff"/><stop offset="1" stop-color="#ddd1ff"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".32"/><stop offset=".3" stop-color="#000" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".14"/><stop offset=".7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".36"/>
    </linearGradient>
    <radialGradient id="dome" cx=".42" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/>
    </radialGradient>
    <pattern id="knitRib" width="12" height="16" patternUnits="userSpaceOnUse">
      <rect width="12" height="16" fill="#5b2bd0"/>
      <path d="M1 0 L6 8 L1 16 M11 0 L6 8 L11 16" fill="none" stroke="#4a1fb8" stroke-width="2"/>
      <path d="M6 0 V16" stroke="#7446ec" stroke-width="1.5" opacity=".7"/>
    </pattern>
    <pattern id="knitRib2" width="12" height="16" patternUnits="userSpaceOnUse">
      <rect width="12" height="16" fill="#4d21b5"/>
      <path d="M1 0 L6 8 L1 16 M11 0 L6 8 L11 16" fill="none" stroke="#3b1790" stroke-width="2"/>
      <path d="M6 0 V16" stroke="#6a3de0" stroke-width="1.5" opacity=".7"/>
    </pattern>

    <g id="podium">
      <path d="M-260 0 L-260 130 A260 50 0 0 0 260 130 L260 0 Z" fill="url(#podSide)"/>
      <ellipse cx="0" cy="0" rx="260" ry="50" fill="url(#podTop)"/>
    </g>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg5)"/>
  <ellipse cx="800" cy="360" rx="820" ry="440" fill="#fff" opacity=".45" filter="url(#b40)"/>
  <rect width="1600" height="1200" filter="url(#paper)" opacity=".12" style="mix-blend-mode:multiply"/>

  <g color="#7b4dff">
    <use href="#i-star" x="250" y="170" width="46" height="46"/>
    <use href="#i-star" x="1330" y="210" width="34" height="34" color="#d2ff3f"/>
    <use href="#i-star" x="760" y="120" width="26" height="26" color="#ff77c8"/>
  </g>
  <g transform="translate(-80 -150) scale(1.1)">
  <!-- подиумы -->
  <use href="#podium" x="330" y="800"/>
  <use href="#podium" x="1270" y="800"/>
  <g transform="translate(800 690) scale(.82)"><use href="#podium"/></g>

  <!-- ===== Бини (по центру, дальше) ===== -->
  <g transform="translate(634 350)">
    <ellipse cx="166" cy="344" rx="150" ry="24" fill="#2a1560" opacity=".35" filter="url(#b14)"/>
    <path d="M20 250 C12 110 80 20 166 20 C252 20 320 110 312 250 Z" fill="url(#knitRib)"/>
    <path d="M20 250 C12 110 80 20 166 20 C252 20 320 110 312 250 Z" fill="url(#dome)"/>
    <path d="M166 20 C150 30 140 36 126 50 M166 20 C182 30 192 36 206 50" stroke="#2c0f7a" stroke-width="3" opacity=".4" fill="none"/>
    <path d="M14 244 C60 262 272 262 318 244 L322 330 C270 352 62 352 10 330 Z" fill="url(#knitRib2)"/>
    <path d="M14 244 C60 262 272 262 318 244 L322 330 C270 352 62 352 10 330 Z" fill="url(#cyl)"/>
    <path d="M14 244 C60 262 272 262 318 244" fill="none" stroke="#1c0a3f" stroke-width="4" opacity=".35"/>
    <!-- тканая бирка -->
    <g filter="url(#drop)">
      <rect x="112" y="266" width="108" height="50" rx="4" fill="#e4d9ff"/>
      <rect x="116" y="270" width="100" height="42" rx="3" fill="none" stroke="#b8a1ff" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="160" y="299" text-anchor="middle" class="u" font-weight="900" font-size="20" fill="#3b1886">ИУЭС</text>
      <path d="M202 283 c.5 4 2 5.5 6 6 c-4 .5 -5.5 2 -6 6 c-.5 -4 -2 -5.5 -6 -6 c4 -.5 5.5 -2 6 -6 Z" fill="#7b4dff"/>
    </g>
  </g>

  <!-- ===== Панама ===== -->
  <g transform="translate(120 520) scale(.7)">
    <ellipse cx="300" cy="400" rx="300" ry="44" fill="#2a1560" opacity=".35" filter="url(#b14)"/>
    <!-- поля -->
    <path d="M128 296 C82 306 34 336 10 378 C60 424 540 424 590 378 C566 336 518 306 472 296 Z" fill="#a58cf5"/>
    <path d="M10 378 C60 424 540 424 590 378 L590 386 C540 434 60 434 10 386 Z" fill="#7a60d4"/>
    <path d="M10 378 C60 424 540 424 590 378 C566 336 518 306 472 296 L128 296 C82 306 34 336 10 378 Z" fill="url(#cyl)"/>
    <path d="M30 372 C90 410 510 410 570 372" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 5" opacity=".5"/>
    <path d="M52 362 C110 396 490 396 548 362" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 5" opacity=".4"/>
    <path d="M76 350 C130 380 470 380 524 350" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 5" opacity=".3"/>
    <!-- тулья -->
    <path d="M128 304 C130 220 138 150 156 110 C200 86 400 86 444 110 C462 150 470 220 472 304 C472 340 128 340 128 304 Z" fill="#b39cfb"/>
    <path d="M128 304 C130 220 138 150 156 110 C200 86 400 86 444 110 C462 150 470 220 472 304 C472 340 128 340 128 304 Z" fill="url(#cyl)"/>
    <ellipse cx="300" cy="104" rx="144" ry="24" fill="#c6b4ff"/>
    <ellipse cx="300" cy="104" rx="128" ry="18" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 5" opacity=".45"/>
    <path d="M130 294 C130 332 470 332 470 294" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 5" opacity=".4"/>
    <path d="M128 304 C128 342 472 342 472 304" fill="none" stroke="#1c0a3f" stroke-width="12" opacity=".25" filter="url(#b8)"/>
    <circle cx="178" cy="196" r="7" fill="url(#silver)" stroke="#6b6780" stroke-width="1.5"/>
    <circle cx="422" cy="196" r="7" fill="url(#silver)" stroke="#6b6780" stroke-width="1.5"/>
    <!-- вышивка -->
    <g filter="url(#emb)">
      <text x="300" y="244" text-anchor="middle" class="u" font-weight="900" font-size="58" fill="#3b1886">ИУЭС</text>
      <path d="M12 0 C12.9 7.2 16.8 11.1 24 12 C16.8 12.9 12.9 16.8 12 24 C11.1 16.8 7.2 12.9 0 12 C7.2 11.1 11.1 7.2 12 0 Z" transform="translate(412 160) scale(1.3)" fill="#d2ff3f"/>
      <text x="300" y="282" text-anchor="middle" class="m" font-weight="800" font-size="15" letter-spacing="6" fill="#3b1886">ТАГАНРОГ</text>
    </g>
    <rect x="0" y="80" width="600" height="360" filter="url(#canvas)" opacity=".12" style="mix-blend-mode:overlay"/>
  </g>

  <!-- ===== Кепка ===== -->
  <g transform="translate(1060 505) scale(.7)">
    <ellipse cx="300" cy="430" rx="250" ry="40" fill="#07021a" opacity=".35" filter="url(#b14)"/>
    <!-- купол -->
    <path d="M100 330 C100 150 190 70 300 70 C410 70 500 150 500 330 Z" fill="#3a1a8a"/>
    <path d="M100 330 C100 150 190 70 300 70 C410 70 500 150 500 330 Z" fill="url(#dome)"/>
    <path d="M300 72 C236 92 186 190 176 330" fill="none" stroke="#12053a" stroke-width="2.5" opacity=".6"/>
    <path d="M300 72 C364 92 414 190 424 330" fill="none" stroke="#12053a" stroke-width="2.5" opacity=".6"/>
    <path d="M300 72 V330" stroke="#12053a" stroke-width="2.5" opacity=".6"/>
    <path d="M292 76 C230 98 184 192 176 330" fill="none" stroke="#8f70f5" stroke-width="1.3" stroke-dasharray="5 4" opacity=".45"/>
    <path d="M308 76 C370 98 416 192 424 330" fill="none" stroke="#8f70f5" stroke-width="1.3" stroke-dasharray="5 4" opacity=".45"/>
    <circle cx="186" cy="170" r="7" fill="none" stroke="#d2ff3f" stroke-width="3"/>
    <circle cx="414" cy="170" r="7" fill="none" stroke="#d2ff3f" stroke-width="3"/>
    <ellipse cx="300" cy="72" rx="16" ry="8" fill="#d2ff3f"/>
    <!-- вышивка 3D -->
    <g filter="url(#emb)">
      <use href="#owl" x="238" y="116" width="124" height="151" style="--owl-body:#7b4dff; --owl-face:#e4d9ff; --owl-belly:#b8a1ff; --owl-accent:#d2ff3f"/>
      <text x="300" y="306" text-anchor="middle" class="u" font-weight="900" font-size="30" fill="#d2ff3f">ИУЭС</text>
    </g>
    <!-- козырёк -->
    <path d="M92 324 C160 352 440 352 508 324 C534 360 484 434 300 442 C116 434 66 360 92 324 Z" fill="#2e1474"/>
    <path d="M92 324 C160 352 440 352 508 324 C534 360 484 434 300 442 C116 434 66 360 92 324 Z" fill="url(#cyl)"/>
    <path d="M100 336 C170 364 430 364 500 336" fill="none" stroke="#8f70f5" stroke-width="1.3" stroke-dasharray="5 4" opacity=".5"/>
    <path d="M110 356 C180 384 420 384 490 356" fill="none" stroke="#8f70f5" stroke-width="1.3" stroke-dasharray="5 4" opacity=".4"/>
    <path d="M86 330 C66 364 116 436 300 444 C484 436 534 364 514 330" fill="none" stroke="#d2ff3f" stroke-width="5"/>
    <path d="M200 380 C240 396 360 396 400 380" fill="none" stroke="#fff" stroke-width="16" opacity=".1" filter="url(#b8)"/>
    <path d="M92 324 C160 352 440 352 508 324" fill="none" stroke="#07021a" stroke-width="8" opacity=".35" filter="url(#b4)"/>
    <rect x="80" y="60" width="440" height="400" filter="url(#canvas)" opacity=".1" style="mix-blend-mode:overlay"/>
  </g>

  </g>

  <text x="64" y="1070" class="u" font-weight="800" font-size="30" fill="#1c0a3f">Панама, бини и кепка</text>
  <text x="64" y="1108" class="m" font-weight="500" font-size="20" fill="#4a3d78">Лавандовая панама с вышивкой «ИУЭС • Таганрог» — для лета у моря · короткая бини с тканой биркой</text>
  <text x="64" y="1138" class="m" font-weight="500" font-size="20" fill="#4a3d78">Бейсболка ночного цвета с объёмной 3D-вышивкой совы и кантом цвета лайм</text>
  <text x="1536" y="1138" text-anchor="end" class="u" font-weight="800" font-size="18" fill="#7b4dff">МЕРЧ ИУЭС • 05</text>

  <rect width="1600" height="1200" filter="url(#grain)" opacity=".07" style="mix-blend-mode:overlay"/>
</svg>
</div>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Худи «Совёнок»</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<script src="shared.js"></script>
<div class="scene">
<svg viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe9ff"/><stop offset=".78" stop-color="#ddd2fb"/><stop offset="1" stop-color="#cfc1f5"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hl" cx=".5" cy=".38" r=".55">
      <stop offset="0" stop-color="#9c7cff" stop-opacity=".2"/><stop offset="1" stop-color="#9c7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0326" stop-opacity=".45"/><stop offset=".22" stop-color="#0d0326" stop-opacity="0"/>
      <stop offset=".78" stop-color="#0d0326" stop-opacity="0"/><stop offset="1" stop-color="#0d0326" stop-opacity=".45"/>
    </linearGradient>
    <pattern id="rib" width="7" height="10" patternUnits="userSpaceOnUse">
      <rect width="7" height="10" fill="#361885"/><rect width="3" height="10" fill="#2a116c"/>
    </pattern>

    <!-- Силуэт: левая половина (перед) -->
    <path id="hf-body" d="M304 126 L234 106 C200 116 160 130 128 146 C98 160 76 192 68 240 L46 556 C44 600 44 636 46 664 L120 668 C121 636 121 604 122 578 L126 556 L141 302 L143 612 C143 648 146 676 150 702 L304 704 Z"/>
    <path id="hb-body" d="M304 98 L234 106 C200 116 160 130 128 146 C98 160 76 192 68 240 L46 556 C44 600 44 636 46 664 L120 668 C121 636 121 604 122 578 L126 556 L141 302 L143 612 C143 648 146 676 150 702 L304 704 Z"/>
    <path id="h-cuff" d="M47 560 C44 600 44 636 46 664 L120 668 C121 636 121 604 125 560 Z"/>
    <path id="h-hem" d="M143 612 C143 648 146 676 150 702 L304 704 L304 612 Z"/>
    <path id="h-hood" d="M304 32 C254 30 212 50 200 90 C195 108 203 121 220 127 L304 146 Z"/>

    <clipPath id="clipF">
      <use href="#hf-body"/><use href="#hf-body" transform="translate(600 0) scale(-1 1)"/>
      <use href="#h-hood"/><use href="#h-hood" transform="translate(600 0) scale(-1 1)"/>
    </clipPath>
    <clipPath id="clipB">
      <use href="#hb-body"/><use href="#hb-body" transform="translate(600 0) scale(-1 1)"/>
    </clipPath>

    <!-- Половина с деталями, одинаковыми для переда и спины -->
    <g id="h-half-common">
      <use href="#h-cuff" fill="url(#rib)"/>
      <use href="#h-hem" fill="url(#rib)"/>
      <path d="M47 560 L125 560" stroke="#1d0b4d" stroke-width="3" opacity=".6"/>
      <path d="M143 612 L304 612" stroke="#1d0b4d" stroke-width="3" opacity=".6"/>
      <path d="M128 146 C136 200 140 250 141 302" fill="none" stroke="#1d0b4d" stroke-width="2.5" opacity=".7"/>
      <path d="M134 150 C142 204 146 252 147 300" fill="none" stroke="#8d6cf0" stroke-width="1.4" stroke-dasharray="5 4" opacity=".45"/>
      <path d="M126 556 L141 302" fill="none" stroke="#12053a" stroke-width="5" opacity=".55" filter="url(#b2)"/>
      <!-- складки рукава -->
      <g fill="none" stroke-linecap="round">
        <g stroke="#12053a" opacity=".38" filter="url(#b4)" stroke-width="7">
          <path d="M60 392 C80 386 104 392 132 382"/>
          <path d="M58 424 C84 420 104 428 131 416"/>
          <path d="M54 470 C74 470 96 474 128 462"/>
          <path d="M58 520 L62 552 M80 516 L82 552 M102 518 L104 552"/>
        </g>
        <g stroke="#a88bff" opacity=".22" filter="url(#b4)" stroke-width="6">
          <path d="M62 404 C82 400 104 406 130 398"/>
          <path d="M58 440 C84 438 104 444 130 432"/>
          <path d="M70 520 L72 548 M92 516 L94 548"/>
        </g>
        <!-- складки корпуса -->
        <path d="M168 330 C176 410 170 490 176 590" stroke="#12053a" stroke-width="16" opacity=".22" filter="url(#b8)"/>
        <path d="M192 340 C198 420 194 490 198 590" stroke="#a88bff" stroke-width="12" opacity=".14" filter="url(#b8)"/>
        <path d="M172 588 L170 610 M206 590 L205 610 M238 588 L238 610" stroke="#12053a" stroke-width="5" opacity=".35" filter="url(#b2)"/>
      </g>
    </g>

    <g id="h-pocket-half">
      <path d="M304 452 L214 452 L180 560 L178 606 L304 606 Z" fill="#46229e"/>
      <path d="M214 452 L180 560" stroke="#10043a" stroke-width="7" opacity=".55" filter="url(#b2)"/>
      <path d="M216 458 L184 560" stroke="#8d6cf0" stroke-width="1.4" stroke-dasharray="5 4" opacity=".6"/>
      <path d="M214 452 L304 452" stroke="#1d0b4d" stroke-width="2.5" opacity=".7"/>
      <path d="M216 458 L304 458" stroke="#8d6cf0" stroke-width="1.4" stroke-dasharray="5 4" opacity=".5"/>
      <path d="M190 520 C220 530 262 528 304 520" stroke="#12053a" stroke-width="8" opacity=".2" filter="url(#b4)" fill="none"/>
    </g>
  </defs>

  <!-- студия -->
  <rect width="1600" height="1200" fill="url(#wall)"/>
  <ellipse cx="800" cy="480" rx="900" ry="620" fill="url(#spot)"/>

  <!-- ===== ПЕРЕД ===== -->
  <g transform="translate(92 128) scale(1.13)">
    <!-- тень на стене -->
    <g transform="translate(22 30)" opacity=".28" filter="url(#b24)" fill="#2a1560">
      <use href="#hf-body"/><use href="#hf-body" transform="translate(600 0) scale(-1 1)"/>
      <use href="#h-hood"/><use href="#h-hood" transform="translate(600 0) scale(-1 1)"/>
    </g>
    <use href="#h-hood" fill="#3a1b8a"/><use href="#h-hood" fill="#3a1b8a" transform="translate(600 0) scale(-1 1)"/>
    <use href="#hf-body" fill="#3d1c8f"/><use href="#hf-body" fill="#3d1c8f" transform="translate(600 0) scale(-1 1)"/>
    <use href="#h-half-common"/><use href="#h-half-common" transform="translate(600 0) scale(-1 1)"/>
    <use href="#h-pocket-half"/><use href="#h-pocket-half" transform="translate(600 0) scale(-1 1)"/>

    <!-- принт на рукаве -->
    <g filter="url(#print)">
      <text transform="translate(76 300) rotate(94)" class="u" font-weight="800" font-size="15" fill="#d2ff3f" letter-spacing="1">ЭКО • ЭКОНОМ • СОЦИУМ</text>
    </g>

    <!-- капюшон: подкладка и кант -->
    <path d="M304 48 C268 48 244 64 238 92 C236 110 246 125 266 136 L300 156 L334 136 C354 125 364 110 362 92 C356 64 332 48 296 48 Z" fill="#b8a1ff"/>
    <path d="M300 56 C272 56 254 70 249 92 C247 106 258 118 276 127 L300 140 L324 127 C342 118 353 106 351 92 C346 70 328 56 300 56 Z" fill="#7d60de" filter="url(#b8)"/>
    <path d="M300 52 C266 52 244 66 240 92 C238 108 248 122 268 133 L300 152" fill="none" stroke="#45209c" stroke-width="13"/>
    <path d="M300 52 C334 52 356 66 360 92 C362 108 352 122 332 133 L300 152" fill="none" stroke="#45209c" stroke-width="13"/>
    <path d="M300 152 L268 133" stroke="#1d0b4d" stroke-width="3" opacity=".5"/>
    <!-- шнурки -->
    <g fill="none" stroke-linecap="round">
      <path d="M284 146 C279 200 277 252 282 300" stroke="#10043a" stroke-width="10" opacity=".3" filter="url(#b4)" transform="translate(4 6)"/>
      <path d="M322 146 C327 206 330 256 325 312" stroke="#10043a" stroke-width="10" opacity=".3" filter="url(#b4)" transform="translate(4 6)"/>
      <path d="M284 146 C279 200 277 252 282 300" stroke="#d2ff3f" stroke-width="8"/>
      <path d="M322 146 C327 206 330 256 325 312" stroke="#d2ff3f" stroke-width="8"/>
    </g>
    <rect x="277" y="296" width="10" height="28" rx="4" fill="#1c0a3f"/>
    <rect x="320" y="308" width="10" height="28" rx="4" fill="#1c0a3f"/>
    <circle cx="284" cy="146" r="7" fill="#c8c3d8" stroke="#6d6883" stroke-width="2"/>
    <circle cx="322" cy="146" r="7" fill="#c8c3d8" stroke="#6d6883" stroke-width="2"/>

    <!-- вышивка на груди -->
    <g filter="url(#emb)">
      <use href="#owl" x="372" y="186" width="66" height="81" style="--owl-body:#b8a1ff; --owl-face:#e4d9ff; --owl-belly:#e4d9ff; --owl-ink:#1c0a3f; --owl-accent:#d2ff3f"/>
      <text x="405" y="292" text-anchor="middle" class="u" font-weight="900" font-size="21" fill="#d2ff3f">ИУЭС</text>
    </g>

    <!-- свет, объём, фактура -->
    <g clip-path="url(#clipF)">
      <rect width="600" height="720" fill="url(#hl)" style="mix-blend-mode:screen"/>
      <rect x="40" width="520" height="720" fill="url(#side)"/>
      <g fill="none" stroke="#0b0224" stroke-width="44" opacity=".35" filter="url(#b14)">
        <use href="#hf-body"/><use href="#hf-body" transform="translate(600 0) scale(-1 1)"/>
      </g>
      <path d="M410 330 C400 420 412 500 404 590" stroke="#12053a" stroke-width="18" opacity=".2" filter="url(#b8)" fill="none"/>
      <rect width="600" height="720" filter="url(#knit)" opacity=".14" style="mix-blend-mode:overlay"/>
    </g>
  </g>

  <!-- ===== СПИНА ===== -->
  <g transform="translate(830 128) scale(1.13)">
    <g transform="translate(22 30)" opacity=".28" filter="url(#b24)" fill="#2a1560">
      <use href="#hb-body"/><use href="#hb-body" transform="translate(600 0) scale(-1 1)"/>
    </g>
    <use href="#hb-body" fill="#3d1c8f"/><use href="#hb-body" fill="#3d1c8f" transform="translate(600 0) scale(-1 1)"/>
    <use href="#h-half-common"/><use href="#h-half-common" transform="translate(600 0) scale(-1 1)"/>

    <!-- принт на спине -->
    <g filter="url(#print)">
      <g color="#d2ff3f">
        <use href="#i-star" x="136" y="380" width="26" height="26"/>
        <use href="#i-star" x="440" y="372" width="18" height="18" color="#b8a1ff"/>
      </g>
      <text x="300" y="402" text-anchor="middle" class="m" font-weight="800" font-size="15" letter-spacing="5" fill="#b8a1ff">ЮФУ • ТАГАНРОГ</text>
      <text x="300" y="494" text-anchor="middle" class="u" font-weight="900" font-size="92" fill="#d2ff3f">ИУЭС</text>
      <text x="300" y="548" text-anchor="middle" class="h" font-size="40" fill="#ffffff" transform="rotate(-3 300 548)">управляю своим будущим</text>
      <g transform="translate(212 562)">
        <circle cx="22" cy="22" r="22" fill="#d2ff3f"/><use href="#i-econ" x="9" y="9" width="26" height="26" color="#1c0a3f"/>
        <circle cx="88" cy="22" r="22" fill="#b8a1ff"/><use href="#i-eco" x="75" y="9" width="26" height="26" color="#1c0a3f"/>
        <circle cx="154" cy="22" r="22" fill="#ff77c8"/><use href="#i-soc" x="141" y="9" width="26" height="26" color="#1c0a3f"/>
      </g>
    </g>

    <!-- капюшон, лежащий на спине -->
    <g opacity=".45" filter="url(#b8)" fill="#0b0224" transform="translate(0 10)">
      <path d="M304 80 C270 80 240 88 228 106 C212 150 214 232 240 292 C258 326 282 340 304 342 Z"/>
      <path d="M296 80 C330 80 360 88 372 106 C388 150 386 232 360 292 C342 326 318 340 296 342 Z"/>
    </g>
    <path d="M304 80 C270 80 240 88 228 106 C212 150 214 232 240 292 C258 326 282 340 304 342 Z" fill="#391a88"/>
    <path d="M296 80 C330 80 360 88 372 106 C388 150 386 232 360 292 C342 326 318 340 296 342 Z" fill="#391a88"/>
    <path d="M300 84 C268 84 244 92 234 108 C300 96 300 96 366 108 C356 92 332 84 300 84 Z" fill="#a88bff" opacity=".18" filter="url(#b4)"/>
    <path d="M300 82 L300 340" stroke="#1d0b4d" stroke-width="2.5" opacity=".7"/>
    <path d="M306 86 L306 336" stroke="#8d6cf0" stroke-width="1.4" stroke-dasharray="5 4" opacity=".45"/>
    <path d="M240 150 C236 210 250 262 280 300" fill="none" stroke="#a88bff" stroke-width="14" opacity=".15" filter="url(#b8)"/>
    <path d="M230 106 C214 150 216 232 242 292 C260 326 282 340 300 342 C318 340 340 326 358 292 C384 232 386 150 370 106" fill="none" stroke="#b8a1ff" stroke-width="3" opacity=".45"/>

    <g clip-path="url(#clipB)">
      <rect width="600" height="720" fill="url(#hl)" style="mix-blend-mode:screen"/>
      <rect x="40" width="520" height="720" fill="url(#side)"/>
      <g fill="none" stroke="#0b0224" stroke-width="44" opacity=".35" filter="url(#b14)">
        <use href="#hb-body"/><use href="#hb-body" transform="translate(600 0) scale(-1 1)"/>
      </g>
      <rect width="600" height="720" filter="url(#knit)" opacity=".14" style="mix-blend-mode:overlay"/>
    </g>
  </g>

  <!-- подписи -->
  <g class="m" font-weight="800" font-size="16" letter-spacing="4" fill="#6a58a0">
    <text x="431" y="963" text-anchor="middle">ПЕРЕД</text>
    <text x="1169" y="963" text-anchor="middle">СПИНА</text>
  </g>
  <text x="64" y="1070" class="u" font-weight="800" font-size="30" fill="#1c0a3f">Худи «Совёнок»</text>
  <text x="64" y="1108" class="m" font-weight="500" font-size="20" fill="#4a3d78">Оверсайз, футер 3-нитка с начёсом · вышитая сова на груди · шелкография на спине и рукаве</text>
  <text x="64" y="1138" class="m" font-weight="500" font-size="20" fill="#4a3d78">Капюшон на лавандовой подкладке, шнурки цвета лайм</text>
  <text x="1536" y="1138" text-anchor="end" class="u" font-weight="800" font-size="18" fill="#7b4dff">МЕРЧ ИУЭС • 01</text>

  <rect width="1600" height="1200" filter="url(#grain)" opacity=".07" style="mix-blend-mode:overlay"/>
</svg>
</div>
</body>
</html>
